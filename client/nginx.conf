server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests -> the server container. Browser sees everything as one
    # origin (this Nginx), so cookies (the refresh token) and CORS just work
    # without any special configuration.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded note files (local disk storage — see storageService.js)
    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
    }

    # WebSocket upgrade for real-time notifications (Socket.IO)
    location /socket.io/ {
        proxy_pass http://server:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # React Router — any unmatched path falls back to index.html so client-side
    # routing (e.g. a hard refresh on /notes/abc123) works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets; index.html itself is never cached.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
